<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="wc" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="90" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="14"/>
    </filter>
    <filter id="edge" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="60" result="d"/>
      <feGaussianBlur in="d" stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="1600" height="760" fill="#f7fbfe"/>
  <g filter="url(#wc)" style="mix-blend-mode:multiply">
    <ellipse cx="1260" cy="230" rx="420" ry="260" fill="#a9d2ef" opacity=".55"/>
    <ellipse cx="1430" cy="520" rx="300" ry="220" fill="#c9c3ec" opacity=".45"/>
    <ellipse cx="980" cy="560" rx="360" ry="190" fill="#bfe3f2" opacity=".5"/>
    <ellipse cx="220" cy="80" rx="380" ry="170" fill="#d4e9f8" opacity=".55"/>
    <ellipse cx="80" cy="620" rx="300" ry="200" fill="#f3d6e2" opacity=".35"/>
  </g>
  <g filter="url(#edge)" style="mix-blend-mode:multiply">
    <ellipse cx="1240" cy="260" rx="250" ry="150" fill="#7fb7e0" opacity=".28"/>
    <ellipse cx="1050" cy="520" rx="160" ry="90" fill="#9a93d8" opacity=".18"/>
    <ellipse cx="1480" cy="120" rx="120" ry="80" fill="#6fb0d8" opacity=".2"/>
  </g>
</svg>
